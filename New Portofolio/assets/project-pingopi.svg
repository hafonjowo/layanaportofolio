<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181311" />
      <stop offset="60%" stop-color="#0f0c0b" />
      <stop offset="100%" stop-color="#070605" />
    </linearGradient>

    <!-- Warm Amber Glow -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Caramel Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Neon Cyan Accent -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <filter id="cafeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" fill="url(#bgGrad)" />

  <!-- Ambient Coffee Warm Lights -->
  <circle cx="120" cy="100" r="140" fill="#f59e0b" opacity="0.08" filter="url(#cafeGlow)" />
  <circle cx="500" cy="260" r="120" fill="#8b5cf6" opacity="0.08" filter="url(#cafeGlow)" />

  <!-- Browser Window Container -->
  <g transform="translate(24, 20)">
    <!-- Browser Frame -->
    <rect width="552" height="320" rx="14" fill="#14100e" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1.5" />
    
    <!-- Window Header Bar -->
    <rect width="552" height="38" rx="14" fill="#1e1814" />
    <path d="M 0 38 L 552 38" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="20" cy="19" r="5" fill="#ef4444" opacity="0.85" />
    <circle cx="36" cy="19" r="5" fill="#f59e0b" opacity="0.85" />
    <circle cx="52" cy="19" r="5" fill="#10b981" opacity="0.85" />

    <!-- URL Omnibar -->
    <rect x="80" y="8" width="260" height="22" rx="6" fill="#100c0a" stroke="rgba(255,255,255,0.06)" />
    <text x="96" y="23" fill="#a8a29e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="500">
      https://pingopi.cafe · Official Website
    </text>

    <!-- Pingopi Logo Badge inside Bar -->
    <g transform="translate(430, 10)">
      <rect width="105" height="19" rx="5" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.3)" />
      <text x="12" y="13.5" fill="#f59e0b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="1">
        ☕ PINGOPI
      </text>
    </g>

    <!-- Website Body Layout -->
    <!-- 1. Cafe Hero Section -->
    <g transform="translate(24, 56)">
      <!-- Hero Banner Card -->
      <rect width="504" height="135" rx="10" fill="#1c1613" stroke="rgba(255,255,255,0.06)" />
      
      <!-- Cafe Headline & Tagline -->
      <text x="24" y="38" fill="#f59e0b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="2">
        SPECIALTY COFFEE &amp; ARTISAN ROASTERY
      </text>
      <text x="24" y="68" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800">
        Every Sip Tells A Story.
      </text>
      <text x="24" y="90" fill="#a8a29e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="400">
        Nikmati racikan kopi autentik dan suasana estetik di Cafe Pingopi.
      </text>

      <!-- Action Buttons -->
      <rect x="24" y="102" width="100" height="24" rx="6" fill="url(#amberGrad)" />
      <text x="42" y="117" fill="#000000" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700">
        Pesan Meja ↗
      </text>

      <rect x="132" y="102" width="100" height="24" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
      <text x="150" y="117" fill="#f5f5f4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600">
        Daftar Menu
      </text>

      <!-- Coffee Cup Graphic Illustration -->
      <g transform="translate(390, 18)">
        <!-- Saucer -->
        <ellipse cx="45" cy="85" rx="42" ry="10" fill="#29221d" stroke="#f59e0b" stroke-width="1.2" opacity="0.6" />
        
        <!-- Cup Body -->
        <path d="M 18 36 L 24 75 Q 45 88 66 75 L 72 36 Z" fill="#211a15" stroke="#f59e0b" stroke-width="2" />
        
        <!-- Cup Handle -->
        <path d="M 68 44 C 84 44 84 66 65 68" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
        
        <!-- Coffee Surface & Latte Art Heart -->
        <ellipse cx="45" cy="38" rx="27" ry="10" fill="#583115" />
        <path d="M 45 34 C 42 30 36 30 36 35 C 36 40 45 44 45 44 C 45 44 54 40 54 35 C 54 30 48 30 45 34 Z" fill="#fef3c7" opacity="0.8" />
        
        <!-- Steam Animation Lines -->
        <path d="M 36 24 Q 40 16 35 8" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
        <path d="M 45 22 Q 50 14 46 6" fill="none" stroke="#fef3c7" stroke-width="1.8" stroke-linecap="round" opacity="0.7" />
        <path d="M 54 25 Q 58 17 53 9" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
      </g>
    </g>

    <!-- 2. Menu Catalog Showcase Row -->
    <g transform="translate(24, 203)">
      <!-- Item 1: Signature Espresso -->
      <rect x="0" y="0" width="158" height="98" rx="8" fill="#1c1613" stroke="rgba(255,255,255,0.05)" />
      <circle cx="28" cy="28" r="14" fill="rgba(245,158,11,0.15)" />
      <text x="22" y="33" font-size="14">☕</text>
      <text x="50" y="24" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700">Pingopi Blend</text>
      <text x="50" y="38" fill="#f59e0b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600">Rp 24.000</text>
      <text x="14" y="62" fill="#78716c" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5">Double shot espresso, notes of dark chocolate &amp; hazelnut.</text>
      <rect x="14" y="74" width="60" height="15" rx="4" fill="rgba(245,158,11,0.1)" />
      <text x="21" y="84" fill="#f59e0b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="600">Best Seller ★</text>

      <!-- Item 2: Creamy Caramel Latte -->
      <rect x="173" y="0" width="158" height="98" rx="8" fill="#1c1613" stroke="rgba(255,255,255,0.05)" />
      <circle cx="201" cy="28" r="14" fill="rgba(0,245,255,0.12)" />
      <text x="195" y="33" font-size="14">🥛</text>
      <text x="223" y="24" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700">Caramel Latte</text>
      <text x="223" y="38" fill="#38bdf8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600">Rp 28.000</text>
      <text x="187" y="62" fill="#78716c" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5">Steamed fresh milk with handmade caramel syrup drizzle.</text>
      <rect x="187" y="74" width="55" height="15" rx="4" fill="rgba(56,189,248,0.1)" />
      <text x="194" y="84" fill="#38bdf8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="600">Specialty</text>

      <!-- Item 3: Artisan Pastry -->
      <rect x="346" y="0" width="158" height="98" rx="8" fill="#1c1613" stroke="rgba(255,255,255,0.05)" />
      <circle cx="374" cy="28" r="14" fill="rgba(168,85,247,0.15)" />
      <text x="368" y="33" font-size="14">🥐</text>
      <text x="396" y="24" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700">Butter Croissant</text>
      <text x="396" y="38" fill="#c084fc" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600">Rp 22.000</text>
      <text x="360" y="62" fill="#78716c" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5">Freshly baked French-style flaky butter croissant.</text>
      <rect x="360" y="74" width="50" height="15" rx="4" fill="rgba(168,85,247,0.1)" />
      <text x="367" y="84" fill="#c084fc" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="600">Fresh Daily</text>
    </g>
  </g>
</svg>
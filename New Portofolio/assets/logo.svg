<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" width="250" height="64" fill="none">
  <defs>
    <!-- Cyan to Blue Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#00a3ff" />
    </linearGradient>

    <!-- Arrow Diagonal Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c8ff" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Purple to Violet Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Dot Gradient -->
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Icon Group -->
  <g transform="translate(4, 2)" filter="url(#logoGlow)">
    <!-- 1. Left Vertical Cyan U-shape -->
    <path d="M 14 12 L 14 44 C 14 52 20 57 28 57 C 36 57 41 52 41 44 L 41 22" 
          stroke="url(#cyanGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- 2. Bottom Purple L-Base -->
    <path d="M 30 57 L 62 57 C 67 57 71 53 71 48 C 71 43 67 39 62 39 L 41 39" 
          stroke="url(#purpleGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- 3. Diagonal Arrow -->
    <line x1="26" y1="53" x2="63" y2="17" stroke="url(#arrowGrad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 48 16 L 65 16 L 65 33" stroke="url(#arrowGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- 4. Floating Dot -->
    <circle cx="73" cy="8" r="3.6" fill="url(#dotGrad)" />
  </g>

  <!-- Brand Text -->
  <g transform="translate(94, 35)">
    <!-- LAYANA -->
    <text x="0" y="0" 
          fill="#ffffff" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="24" 
          font-weight="800" 
          letter-spacing="3.5">LAYANA</text>

    <!-- PORTOFOLIO -->
    <text x="1.5" y="17" 
          fill="#94a3b8" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="9.5" 
          font-weight="600" 
          letter-spacing="5">PORTOFOLIO</text>
  </g>
</svg>

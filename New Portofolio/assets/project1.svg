<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#p1Grad)" />
  <!-- Window bar -->
  <rect x="0" y="0" width="600" height="36" fill="#18182b" />
  <circle cx="20" cy="18" r="5" fill="#ef4444" />
  <circle cx="36" cy="18" r="5" fill="#f59e0b" />
  <circle cx="52" cy="18" r="5" fill="#10b981" />
  <text x="80" y="22" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">codecraft-store.app/dashboard</text>
  
  <!-- Sidebar -->
  <rect x="20" y="56" width="120" height="280" rx="10" fill="#131424" stroke="rgba(255,255,255,0.06)" />
  <rect x="35" y="75" width="80" height="12" rx="4" fill="#6366f1" opacity="0.6" />
  <rect x="35" y="105" width="90" height="8" rx="4" fill="#334155" />
  <rect x="35" y="125" width="70" height="8" rx="4" fill="#334155" />
  <rect x="35" y="145" width="85" height="8" rx="4" fill="#334155" />

  <!-- Main Grid -->
  <!-- Top Stats -->
  <rect x="160" y="56" width="130" height="65" rx="10" fill="#181a30" stroke="rgba(168,85,247,0.3)" />
  <text x="175" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11">Total Revenue</text>
  <text x="175" y="106" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">$128,450</text>

  <rect x="305" y="56" width="130" height="65" rx="10" fill="#181a30" stroke="rgba(255,255,255,0.06)" />
  <text x="320" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11">Active Orders</text>
  <text x="320" y="106" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">1,420</text>

  <rect x="450" y="56" width="130" height="65" rx="10" fill="#181a30" stroke="rgba(255,255,255,0.06)" />
  <text x="465" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11">Conversion</text>
  <text x="465" y="106" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="700">+4.8%</text>

  <!-- Large Chart / Sales Wave -->
  <rect x="160" y="135" width="275" height="200" rx="12" fill="#141628" stroke="rgba(255,255,255,0.06)" />
  <text x="180" y="165" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Monthly Sales Curve</text>
  <!-- Chart Line -->
  <path d="M 180 290 Q 220 260, 260 270 T 340 210 T 410 190" fill="none" stroke="url(#neonPurple)" stroke-width="4" />
  <circle cx="410" cy="190" r="6" fill="#a855f7" stroke="#fff" stroke-width="2" />

  <!-- Donut Chart Card -->
  <rect x="450" y="135" width="130" height="200" rx="12" fill="#141628" stroke="rgba(255,255,255,0.06)" />
  <circle cx="515" cy="225" r="45" fill="none" stroke="#252945" stroke-width="14" />
  <circle cx="515" cy="225" r="45" fill="none" stroke="#8b5cf6" stroke-width="14" stroke-dasharray="190" stroke-dashoffset="60" stroke-linecap="round" />
  <text x="515" y="230" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700">76%</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbd38d" />
      <stop offset="100%" stop-color="#ed8936" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2f" />
      <stop offset="100%" stop-color="#0f111e" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Aura Halo Glow -->
  <circle cx="200" cy="210" r="150" fill="url(#bgGrad)" opacity="0.35" filter="url(#glowFilter)" />
  <circle cx="200" cy="210" r="130" fill="url(#bgGrad)" opacity="0.7" />

  <!-- Developer Silhouette / Character -->
  <g id="developer">
    <!-- Torso / Hoodie -->
    <path d="M 80 480 C 80 370 130 310 200 310 C 270 310 320 370 320 480 Z" fill="url(#hoodieGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
    <!-- Hoodie V-neck & strings -->
    <path d="M 175 310 L 200 365 L 225 310" fill="#181a2b" />
    <path d="M 185 340 L 185 410" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <path d="M 215 340 L 215 410" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <!-- Neck -->
    <rect x="180" y="260" width="40" height="60" rx="10" fill="url(#skinGrad)" />

    <!-- Head -->
    <ellipse cx="200" cy="215" rx="55" ry="65" fill="url(#skinGrad)" />

    <!-- Hair -->
    <path d="M 140 200 C 140 140 180 130 200 130 C 235 130 260 150 260 195 C 245 175 220 170 200 170 C 175 170 155 185 140 200 Z" fill="#1e1e2f" />
    <path d="M 140 190 Q 130 230 145 250 Q 140 220 146 195 Z" fill="#1e1e2f" />
    <path d="M 260 190 Q 270 230 255 250 Q 260 220 254 195 Z" fill="#1e1e2f" />

    <!-- Beard / Stubble -->
    <path d="M 165 240 C 170 270 185 285 200 285 C 215 285 230 270 235 240 C 225 255 210 265 200 265 C 190 265 175 255 165 240 Z" fill="#2d3748" opacity="0.6" />

    <!-- Glasses Frame (Modern Stylish Specs) -->
    <!-- Left Glass -->
    <rect x="156" y="195" width="36" height="24" rx="6" fill="url(#glassGrad)" stroke="#cbd5e1" stroke-width="3" />
    <!-- Right Glass -->
    <rect x="208" y="195" width="36" height="24" rx="6" fill="url(#glassGrad)" stroke="#cbd5e1" stroke-width="3" />
    <!-- Bridge -->
    <path d="M 192 205 L 208 205" stroke="#cbd5e1" stroke-width="3" />
    <!-- Temples -->
    <path d="M 156 205 L 140 200" stroke="#cbd5e1" stroke-width="3" />
    <path d="M 244 205 L 260 200" stroke="#cbd5e1" stroke-width="3" />

    <!-- Eyes inside glasses -->
    <circle cx="174" cy="207" r="4" fill="#0f172a" />
    <circle cx="176" cy="205" r="1.5" fill="#ffffff" />
    <circle cx="226" cy="207" r="4" fill="#0f172a" />
    <circle cx="228" cy="205" r="1.5" fill="#ffffff" />

    <!-- Smile -->
    <path d="M 188 250 Q 200 258 212 250" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Laptop base in front -->
    <path d="M 130 460 L 270 460 L 290 480 L 110 480 Z" fill="#334155" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <rect x="150" y="445" width="100" height="20" rx="3" fill="#1e293b" />
    <!-- Glowing Apple / Logo -->
    <circle cx="200" cy="455" r="3" fill="#38bdf8" />
  </g>
</svg>
